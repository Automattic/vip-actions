# TEMPORARY: exercises changelog's dual-host setup-php. Remove before merging.
name: TMP test changelog
on:
  push:
    branches: [update/changelog-dual-host]
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run changelog against an unreachable endpoint
        id: changelog
        continue-on-error: true
        uses: ./changelog
        with:
          endpoint: 'http://127.0.0.1:9/nothing'
          endpoint-token: dummy
          status: draft
      - name: Check that setup-php ran from the local checkout
        run: |
          set -x
          test -f .vip-actions/setup-php/action.yml
          git -C .vip-actions/setup-php rev-parse HEAD
          php -v | head -1
          php -v | grep -q '^PHP 7\.4'
          test -d vendor/automattic/vip-build-tools
          git status --short | head
