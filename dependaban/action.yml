---

name: Dependaban
description: "This action checks for dependencies that rely on install scripts"

inputs:
  skip-scripts-check:
    description: "Skip the check for postinstall scripts (default: false)"
    required: false
    default: "false"
  node-version:
    description: "Node.js version used to run the check (default: 26). Aliases like lts/* need a GitHub API lookup, which is rate limited on GitHub Enterprise Server runners."
    required: false
    default: "26"

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up Node.js envirtonment
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Run can-i-ignore-scripts check
      if: ${{ inputs.skip-scripts-check != 'true' }}
      run: ${{ github.action_path }}/bin/can-i-ignore-scripts.sh
      shell: bash
