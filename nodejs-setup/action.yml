---
name: Node.js setup and install
description: This composite action performs Node.js setup and install with good caching defaults

inputs:
  fetch-depth:
    description: 'Depth for fetching commits'
    required: false
  node-version:
    description: 'Node.js version (e.g., 18.13.0) for set up'
    required: false
  node-version-file:
    description: 'Node.js version file (e.g., .nvmrc) for set up'
    required: false
  ref:
    description: 'The branch, tag, or SHA to checkout'
    required: false
  ignore-scripts:
    description: 'Ignore scripts when installing dependencies'
    required: false
  sparse-checkout:
    description: 'Do a sparse checkout on given patterns'
    required: false
    default: null
  working-directory:
    description: 'Working directory when running NPM install'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: false

    - name: LS
      shell: bash
      run: ls -al ; ls -al .. ; ls -al api-wpvip-com

    - name: Set up Node.js environment using supplied Node.js version
      id: setup-node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm

    - name: Cache dependencies
      uses: actions/cache@v4
      id: cache-node-modules
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json', 'npm-shrinkwrap.json') }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: cd ${{ inputs.working-directory }}/ && npm ci ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
      shell: bash
