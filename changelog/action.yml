---

name: Publishes VIP Changelogs
inputs:
  endpoint:
    description: 'The endpoint to post the changelog.'
    required: false
    default: 'https://public-api.wordpress.com/wp/v2/sites/vipinternalchangelog.wordpress.com/posts'
  endpoint-token:
    description: 'The WordPress token required in order to post to the WordPress endpoint.'
    required: true
  endpoint-auth-type:
    description: 'The authentication type to use. Can be either "bearer" or "basic".'
    required: false
    default: 'bearer'
  repo-token:
    description: 'The GitHub token required in order to retrieve Pull Requests.'
    required: false
    default: "${{ github.token }}"
  status:
    description: 'Status of the post about to be published. Can be either "publish" or "draft".'
    required: false
    default: 'publish'
  tag-id:
    description: 'The id of a tag to be added to the post.'
    required: false
    default: ''
  category-id:
    description: 'The id of a category to be added to the post.'
    required: false
    default: ''
  link-to-pr:
    description: 'Wether to add a link to the Pull Request to the changelog post.'
    required: false
    default: 'false'
  source:
    description: 'The source of the changelog.'
    required: false
    default: ''
  terms:
    description: 'The terms to be added to the post.'
    required: false
    default: ''
  changelog-title:
    description: 'The title of the changelog post.'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # `uses:` can't choose an action by host, and setup-php has a different name on
    # GitHub Enterprise, so fetch it by name for this host and run it from a local path.
    - name: Fetch setup-php
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: ${{ github.server_url == 'https://github.com' && 'shivammathur/setup-php' || 'third-party-actions/shivammathur-setup-php' }}
        ref: eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        path: .vip-actions/setup-php
        persist-credentials: false

    - name: Setup PHP
      uses: ./.vip-actions/setup-php
      with:
        php-version: "7.4"

    - name: Installs automattic/vip-build-tools
      run: composer require automattic/vip-build-tools:1.6.0
      shell: bash

    - name: Publishes the changelog
      run: |
        php vendor/automattic/vip-build-tools/scripts/github-changelog.php \
          --wp-endpoint='${{ inputs.endpoint }}' \
          --wp-status='${{ inputs.status }}' \
          --wp-tag-ids='${{ inputs.tag-id }}' \
          --wp-categories='${{ inputs.category-id }}' \
          --wp-terms='${{ inputs.terms }}' \
          --link-to-pr='${{ inputs.link-to-pr }}' \
          --changelog-source='${{ inputs.source }}' \
          --changelog-title='${{ inputs.changelog-title }}'
      shell: bash
      env:
        CHANGELOG_POST_TOKEN: ${{ inputs.endpoint-token }}
        CHANGELOG_POST_AUTH_TYPE: ${{ inputs.endpoint-auth-type }}
        GITHUB_TOKEN: ${{ inputs.repo-token }}
        CIRCLE_PROJECT_USERNAME: ${{ github.repository_owner }}
        CIRCLE_PROJECT_REPONAME: ${{ github.event.repository.name }}
        CIRCLE_SHA1: ${{ github.sha }}
        GITHUB_BASE_BRANCH: ${{ github.ref_name }}
